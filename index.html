<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 30%, #1a1e2e, #0a0c13 80%);
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 背景のアンビエント光彩アニメーション */
    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.08) 40%, transparent 70%);
      filter: blur(60px);
      border-radius: 50%;
      pointer-events: none;
      animation: pulse 8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.85) translate(-30px, -20px);
        opacity: 0.7;
      }

      100% {
        transform: scale(1.15) translate(30px, 20px);
        opacity: 1;
      }
    }

    /* メインカード */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2.5rem;
      max-width: 640px;
      margin: 1.5rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: #818cf8;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.2s forwards;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #818cf8;
      box-shadow: 0 0 8px #818cf8;
    }

    .title {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.4s forwards;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      margin: 0 auto 1.5rem;
      border-radius: 2px;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.5s forwards;
    }

    .message {
      font-size: 1.05rem;
      line-height: 1.9;
      color: #94a3b8;
      font-weight: 300;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.6s forwards;
    }

    .hint {
      font-size: 0.85rem;
      color: #64748b;
      letter-spacing: 0.04em;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.8s forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="ambient-glow"></div>

  <main class="container">
    <div class="badge">
      <span class="badge-dot"></span>
      Welcome
    </div>
    <h1 class="title">ようこそ</h1>
    <div class="divider"></div>
    <p class="message">
      新たな始まりの場所へ、心から歓迎いたします。<br>
      ここから素晴らしい体験と発見が広がっていきます。
    </p>
    <p class="hint">準備が整いました。どうぞごゆっくりご覧ください。</p>
  </main>
</body>

</html>
